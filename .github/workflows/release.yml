name: Release

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Least privilege at the top: any job added to this file later starts read-only
# and has to ask. The publish job's elevated grants are scoped to that job.
permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # FOUR conditions, and only the first was here. `workflow_run` is the
    # "pwn request" trigger: it runs in the BASE repo with full secrets
    # (`NPM_TOKEN`, `contents: write`), and it fires for CI runs triggered by
    # `pull_request` — which `ci.yml` accepts unrestricted, so fork PRs
    # included. The `branches: [main]` filter above does NOT help: for a
    # `workflow_run` it matches `head_branch`, and for a fork PR that is the
    # FORK's branch name.
    #
    # So the chain was: fork the repo, name your branch `main`, open a PR. CI
    # runs your commit — you control the tests, so it goes green. Release fires,
    # checks out `head_sha` (your commit), and runs `pnpm install
    # --frozen-lockfile` with your lockfile and `pnpm build` with your
    # `tsup.config.ts`. That is arbitrary code execution in a job holding the
    # publish token, and `changeset publish` will then upload whatever it built
    # as `@gullabs/*`. `Preflight` is no defence — it is the attacker's code too.
    #
    # `event == 'push'` is the load-bearing one: a PR-triggered CI run can never
    # satisfy it. The repository and branch checks are belt and braces, and cost
    # nothing.
    #
    # Not empirically executed — GitHub Actions cannot be run locally — so this
    # is reasoned from the documented `workflow_run` semantics and verified
    # statically by `scripts/check-workflow-guards.mjs`, which fails the build
    # if any of the four is dropped.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      # changeset publish pushes version tags; changesets/action opens the
      # release PR.
      contents: write
      pull-requests: write
      # Required to sign the npm provenance attestation.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check repository.url matches GITHUB_REPOSITORY
        run: |
          node --input-type=module <<'EOF'
          import { readdirSync, readFileSync } from 'node:fs'
          import { join } from 'node:path'

          const expected = process.env.GITHUB_REPOSITORY
          if (!expected) {
            throw new Error('GITHUB_REPOSITORY is unset')
          }

          const failures = []
          for (const entry of readdirSync('packages', { withFileTypes: true })) {
            if (!entry.isDirectory()) continue
            let pkg
            try {
              pkg = JSON.parse(readFileSync(join('packages', entry.name, 'package.json'), 'utf8'))
            } catch (error) {
              if (error && typeof error === 'object' && 'code' in error && error.code === 'ENOENT') continue
              throw error
            }
            if (pkg.private === true || typeof pkg.name !== 'string') continue
            const url = String(pkg.repository?.url ?? '')
            const match = url.match(/^(?:git\+)?https:\/\/github\.com\/([^/]+\/[^/]+?)(?:\.git)?$/)
            const path = match?.[1]
            if (path === undefined) {
              failures.push(`${entry.name}: unparseable repository.url=${JSON.stringify(url)}`)
            } else if (path !== expected) {
              failures.push(`${entry.name}: repository.url path ${path} !== ${expected}`)
            }
          }
          if (failures.length > 0) {
            console.error(failures.join('\n'))
            process.exitCode = 1
          } else {
            console.log(`repository.url path matches ${expected}`)
          }
          EOF

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cheap structural gate, repeated here on purpose: publishable packages
      # point at this repo, ship dist-only, core stays dependency-free, and the
      # licence fields / upstream notices are the ones the owner decided on.
      # CI proved it on this SHA, but this is the last step before bytes leave
      # for a registry that does not let you take them back.
      - name: Preflight
        run: pnpm preflight

      # `pnpm release` builds before it publishes: both packages are
      # `files: ["dist"]`, so publishing an unbuilt workspace ships an empty
      # tarball. `prepack` covers manual publishes for the same reason.
      #
      # changesets runs `pnpm pack` then `pnpm publish <tarball> --access public
      # --no-git-checks`, so the detached HEAD this job checks out is fine and
      # `workspace:*` is rewritten to the real version on the way out.
      # changesets/action@v2 renamed the root inputs (version → version-script,
      # publish → publish-script, title → pr-title, commit → commit-message) and
      # stopped reading GITHUB_TOKEN from the environment — pass github-token.
      # A blind pin bump without these renames breaks the next publish.
      - name: Create Release PR or Publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
