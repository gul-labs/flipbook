version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    ignore:
      # Pinned below typescript-eslint's supported range (see CLAUDE.md and
      # scripts/quality.mjs). A TypeScript major breaks the preflight, so it
      # is bumped by hand when typescript-eslint supports it.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      production-minor:
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        dependency-type: development

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
